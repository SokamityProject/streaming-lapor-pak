name: Build APK

# Jalankan otomatis saat push ke branch main, atau manual lewat tab "Actions"
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Tambahkan platform Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Konfigurasi Android TV (leanback, landscape, banner)
        run: node scripts/android-tv-setup.js

      - name: Beri izin eksekusi gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug)
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk StreamingLaporPak.apk

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: StreamingLaporPak-APK
          path: StreamingLaporPak.apk
          if-no-files-found: error
